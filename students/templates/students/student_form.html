{% extends 'students/base.html' %}
{% block content %}
<div class="card p-4 bg-white">
    <h3 class="mb-3">{{ title }}</h3>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success mt-2">Save</button>
        <a href="{% url 'student_list' %}" class="btn btn-secondary mt-2">Cancel</a>
    </form>
</div>
{% endblock %}
